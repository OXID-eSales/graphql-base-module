# {{ $ids := "oe_graphql_base" }}ids: {{ $ids }}
# {{ $org := "oxid-esales" }}organisation: {{ $org }}
# {{ $name := "graphql-base" }}name: {{ $name }}
# {{ $repo := "OXID-eSales/graphql-base-module" }}repo: {{ $repo }}

install:
    cache:
        prepared_shop: false
    composer:
        root_url: ''
        transform: |
            {
                "require": {
                    "oxid-esales/oxideshop-ce": "v7.4.0",
                    "oxid-esales/twig-component": "v2.7.0",
                    "oxid-esales/twig-admin-theme": "v3.0.0",
                    "oxid-esales/apex-theme": "v3.0.0",
                    "oxid-esales/developer-tools": "v2.5.0"
                }
            }
    custom_script_container: |
        perl -pi -e 'print "SetEnvIf Authorization \"(.*)\" HTTP_AUTHORIZATION=\$1\n\n" if $. == 1' source/.htaccess

        vendor/bin/oe-console oe:database:reset --db-host=mysql --db-port=3306 --db-name=example --db-user=root --db-password=root --force
        vendor/bin/oe-console oe:module:install ./

        vendor/bin/oe-eshop-doctrine_migration migrations:migrate
        vendor/bin/oe-eshop-db_views_generate

        vendor/bin/oe-console oe:module:activate "{{ $ids }}"
        vendor/bin/oe-console oe:theme:activate apex

runscript: &runscript
    matrix:
        script: |
            [
              "report:tests-unit",
              "report:tests-integration",
              "no_report:tests-codeception",
            ]
    report:
        path: ''
    no_report:
        path: ''
        coverage_prefix: ''

runslim:
    <<: *runscript
    matrix:
        script: |
            [
              "report:phpstan-report",
              "no_report:phpmd",
              "no_report:phpcs",
            ]

sonarcloud:
    matrix:
        testplan: '["-"]'
    strip_path: '/var/www/'
    organization: 'oxid-esales'
    project_key: 'OXID-eSales_graphql-base-module'
    project_name: '{{ $org}}/{{ $name }}'
    target_branch: 'b-7.4.x'
    parameters: >
        -Dsonar.language=php
        -Dsonar.scm.provider=git
        -Dsonar.sources=src
        -Dsonar.tests=tests

finish:
    slack_title: '{{ print $name }} ({{ .Data.install.git.ref }}) by {{ .Github.Actor }}'
